<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola Server App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header>
            <h1>🥤 Cola Server</h1>
            <p>Drink Coke by the liter!</p>
        </header>

        <div class="grid">
            <!-- Add User -->
            <div class="card">
                <h2>New Drinker</h2>
                <form id="addUserForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="e.g. Dannka" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="e.g. dan@cola.cz" required>
                    </div>
                    <button type="submit" class="btn-primary">Create User</button>
                </form>
            </div>

            <div class="card">
                <h2>Add Drink</h2>
                <form id="addConsumptionForm">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="number" id="userId" placeholder="User ID" required>
                    </div>
                    <div class="form-group">
                        <label>Amount (ml)</label>
                        <input type="number" id="amount" placeholder="e.g. 500" required>
                    </div>
                    <button type="submit" class="btn-success">Drink!</button>
                </form>
            </div>
        </div>

        <div class="card full-width">
            <div class="header-row">
                <h2>🏆 Leaderboard</h2>
                <button onclick="loadLeaderboard()" class="btn-secondary">Refresh</button>
            </div>
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>User</th>
                        <th>Total Liters</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>


        <!-- Available Achievements -->
        <div class="card full-width">
            <div class="header-row">
                <h2>🏆 Hall of Fame (Objectives)</h2>
                <button onclick="loadAchievements()" class="btn-secondary">Refresh</button>
            </div>
            <div id="achievementsList" class="users-grid">
                <!-- JS will populate -->
            </div>
        </div>

        <!-- Users List -->
        <div class="card full-width">
            <div class="header-row">
                <h2>Users List</h2>
                <button onclick="loadUsers()" class="btn-secondary">Refresh</button>
            </div>
            <div id="usersList" class="users-grid">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
